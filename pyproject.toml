[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-filetools"
version = "1.2.1"
description = "Isolated temporary attachment processing for OpenClaw"
requires-python = ">=3.11,<3.13"
dependencies = ["PyMuPDF==1.25.5", "python-docx==1.1.2", "Pillow==11.1.0", "openpyxl==3.1.5"]

[project.optional-dependencies]
standalone = ["markdown-it-py==3.0.0", "mdurl==0.1.2"]
engines = ["rapidocr-onnxruntime==1.4.4", "onnxruntime==1.20.1", "numpy==1.26.4", "faster-whisper==1.1.1", "requests==2.32.5"]
test = ["pytest==8.3.5", "ruff==0.11.2"]

[project.scripts]
nas-filetools = "nas_filetools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nas_filetools = ["templates/*.json", "templates/published/*/*.json", "review_assets/*.html", "project_assets/*.html", "project_assets/*.js", "project_assets/*.css", "standalone/assets/*.html", "standalone/assets/*.js", "standalone/assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engines: real OCR/transcription engine tests (opt in)"]

[tool.ruff]
line-length = 110
