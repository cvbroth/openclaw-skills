<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileTools · 对照工作台</title><link rel="stylesheet" href="viewer.css"><link rel="stylesheet" href="reading.css"><body>
<header class="topbar"><a id="back" href="../index.html" title="返回项目">← 项目</a><strong id="title" hidden>对照工作台</strong><div class="document-nav" id="leftNav"><select id="leftArtifact" aria-label="left文件"></select><select id="leftPosition" hidden aria-label="left位置"></select><div class="page-nav"><label for="leftPageInput" id="leftPositionLabel">原件页</label><button id="leftPagePrev" aria-label="原件上一位置">‹</button><input id="leftPageInput" type="number" min="1" aria-label="原件位置"><span id="leftPageTotal"></span><button id="leftPageNext" aria-label="原件下一位置">›</button></div></div><div class="document-nav" id="rightNav"><select id="rightArtifact" aria-label="right文件"></select><select id="rightPosition" hidden aria-label="right位置"></select><div class="nav-locations"><div class="page-nav"><label for="rightPageInput" id="rightPositionLabel">文字页</label><button id="rightPagePrev" aria-label="文字上一位置">‹</button><input id="rightPageInput" type="number" min="1" aria-label="文字位置"><span id="rightPageTotal"></span><button id="rightPageNext" aria-label="文字下一位置">›</button></div><div class="source-nav"><label for="sourcePageLookup" title="原件物理页，不是书上印刷页码">来源页</label><input id="sourcePageLookup" type="number" min="1" aria-label="右侧来源物理页"><button id="findSourcePage" aria-label="按来源页阅读">↵</button><button id="locateSelectedSource" title="只定位右侧，不强制联动">到左页</button></div></div></div><div class="actions"><span id="historyState" hidden>历史 · 只读</span><button id="restoreForEdit" hidden>恢复后编辑</button><button id="textMode">编辑</button><button id="saveRevision" class="primary" hidden>保存</button><button id="cancelEdit" hidden>取消</button><span id="textState" role="status" hidden></span><button id="exportText">导出</button><button id="mobile">左右切换</button><button id="toggleAux" aria-expanded="false" aria-controls="auxPanel">辅助面板</button></div><p id="pageNavigationStatus" role="status" hidden></p></header>
<main><section id="leftPane" class="pane"><div id="leftNotice" class="notice"></div><div id="leftContent" class="content"></div></section><section id="rightPane" class="pane"><div id="rightNotice" class="notice"></div><div id="rightContent" class="content"></div></section></main>
<aside id="auxPanel" hidden aria-label="辅助面板"><div class="aux-heading"><strong>辅助面板</strong><button id="closeAux" aria-label="关闭辅助面板">关闭 ×</button></div><nav class="aux-tabs" aria-label="辅助功能"><button data-panel="comments" aria-selected="false">评论</button><button data-panel="source" aria-selected="false">原件与筛选</button><button data-panel="versions" aria-selected="false">版本与差异</button><button data-panel="reading" aria-selected="false">阅读设置</button><button data-panel="technical" aria-selected="false">技术详情</button></nav><div class="aux-content"><section data-section="comments"><details id="commentPanel"><summary>评论与反馈 <span id="commentTargetLabel"></span></summary><div class="comment-heading"><select id="commentScope" aria-label="评论对象"><option value="artifact">评论当前产物</option><option value="source_page">评论原图</option></select><span class="muted">评论独立保存，不改变正文或代表验收。</span></div><textarea id="comment" placeholder="填写当前对象的评论…"></textarea><div class="feedback-actions"><button id="saveServer" class="primary">保存评论</button><button id="clearComment">清除</button><button id="resolveImport" hidden>采用导入记录（先备份）</button><button id="export">导出 JSON</button><label class="file-label">导入 JSON<input id="import" type="file" accept=".json"></label><select id="reviewer"><option value="human">本人（自行声明）</option><option value="developer-agent">开发 Agent 测试</option></select><span id="status" role="status"></span></div></details></section><section data-section="source" hidden><div class="source-tools"><span class="group-title">原图定位</span><select id="sourcePosition" aria-label="原件页"></select><label>原图质量 <select id="quality"><option value="">全部</option><option value="good">能直接辨读</option><option value="usable_with_defects">局部模糊或缺损</option><option value="poor">关键文字难辨</option><option value="undetermined">无法判断</option><option value="unknown">未提供评价</option></select></label><button id="showSource">查看原图</button><details id="qualityDetails"><summary id="qualitySummary">原图评价</summary><select id="evaluation" aria-label="选择原图评价记录"></select><button id="closeQuality">关闭评价</button><p id="qualityEvidence"></p><p class="muted">模型未经校准的自评，不是转写准确率或人工验收。</p></details></div>
<div class="filters"><label>产物错误 <select id="errorFilter"><option value="">全部</option><option value="yes">有处理错误</option><option value="remote">远端错误</option><option value="local">本地错误</option><option value="no">无处理错误</option></select></label><label>产物评论 <select id="commentFilter"><option value="">全部</option><option value="yes">有评论</option><option value="no">无评论</option></select></label></div><p class="muted">顶部“来源页”按原件物理页查找全部匹配内容，临时忽略错误与评论筛选；原图质量筛选只影响左侧，不排除右侧文字。文字位置导航仍按筛选独立浏览。</p></section><section data-section="versions" hidden><button id="textHistory">刷新版本与差异</button><button id="editParent" hidden>修改对应文字稿</button><div id="historyContent"></div></section><section data-section="reading" hidden><label>左侧缩放<select id="leftZoom" aria-label="左侧缩放"><option value="100">适合栏宽</option><option value="125">125%</option><option value="175">175%</option><option value="250">250%</option></select></label><label>右侧缩放<select id="rightZoom" aria-label="右侧缩放"><option value="100">适合栏宽</option><option value="125">125%</option><option value="175">175%</option><option value="250">250%</option></select></label><label>Markdown <select id="markdownMode"><option value="reading">格式化阅读</option><option value="source">源码查看</option></select></label><div><button id="focusLeft">专注左侧</button><button id="focusRight">专注右侧</button></div><p class="muted">两侧独立翻页和滚动，文字位置与原件页不自动对应。</p></section><section data-section="technical" hidden><details class="technical"><summary>技术详情</summary><pre id="technical"></pre></details><div id="diagnostics"></div></section></div></aside>
<script src="project.js"></script><script src="feedback.js"></script><script src="reading-fallbacks.js"></script><script src="viewer.js"></script><script src="source-reader.js"></script><script src="editor.js"></script><script src="workbench.js"></script></body></html>
