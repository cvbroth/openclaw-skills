<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileTools 产物对照</title><link rel="stylesheet" href="viewer.css">
<header><div><strong id="title">产物对照</strong> <a href="../index.html">项目首页</a> <button id="mobile">切换原件／结果</button></div>
<div class="controls"><label>参考 <select id="leftArtifact"></select></label><label>位置 <select id="leftPosition"></select></label><label>评价目标 <select id="rightArtifact"></select></label><label>位置 <select id="rightPosition"></select></label></div>
<div class="controls"><label>质量 <select id="quality"><option value="">全部／无评价也显示</option><option>good</option><option>usable_with_defects</option><option>poor</option><option>undetermined</option><option value="unknown">未提供</option></select></label><label>评论 <select id="commentFilter"><option value="">全部</option><option value="yes">有草稿</option><option value="no">无草稿</option></select></label><label>错误 <select id="errorFilter"><option value="">全部</option><option value="yes">处理错误</option><option value="no">无处理错误</option></select></label><span>左右独立定位与滚动；未推断页码对应关系。</span></div></header>
<main><section id="leftPane" class="pane"><div id="leftNotice" class="notice"></div><div id="leftContent"></div></section><section id="rightPane" class="pane"><div id="rightNotice" class="notice"></div><div id="rightContent"></div></section></main>
<footer><label>人工评论（未确认；与模型自评分开） <textarea id="comment" placeholder="可直接评价当前目标与位置；不会改变正文或自动验收"></textarea></label><div><button id="export">导出评论 JSON</button><label>导入草稿 <input id="import" type="file" accept=".json"></label><select id="reviewer"><option value="human">本人（自行声明）</option><option value="developer-agent">开发 Agent 测试</option></select><span id="status" role="status"></span></div><details><summary>项目、版本与技术信息</summary><pre id="technical"></pre></details></footer>
<script src="project.js"></script><script src="viewer.js"></script></html>
