<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileTools · 对照评审</title><link rel="stylesheet" href="viewer.css">
<header><div class="nav"><a id="back" href="../index.html">← 项目详情</a><strong id="title">产物对照</strong><span class="tag">逐页对照</span><div id="compactTools"><div><button id="compactLeftPrev" aria-label="左侧上一页">‹</button><span id="compactLeft"></span><small id="compactLeftPage"></small><button id="compactLeftNext" aria-label="左侧下一页">›</button></div><div><button id="compactRightPrev" aria-label="右侧上一页">‹</button><span id="compactRight"></span><small id="compactRightPage"></small><button id="compactRightNext" aria-label="右侧下一页">›</button></div></div><button id="focusLeft">专注左侧</button><button id="focusRight">专注右侧</button><button id="toggleToolbar">收起工具栏</button><button id="mobile"><span class="mobile-long">切换原件／结果</span><span class="mobile-short">左右切换</span></button></div>
<div class="source-tools"><span class="group-title">原图定位</span><select id="sourcePosition" aria-label="原件页"></select><label>原图质量 <select id="quality"><option value="">全部</option><option value="good">能直接辨读</option><option value="usable_with_defects">局部模糊或缺损</option><option value="poor">关键文字难辨</option><option value="undetermined">无法判断</option><option value="unknown">未提供评价</option></select></label><button id="showSource">查看原图</button><details id="qualityDetails"><summary id="qualitySummary">原图评价</summary><select id="evaluation" aria-label="选择原图评价记录"></select><p id="qualityEvidence"></p><p class="muted">模型未经校准的自评，不是转写准确率或人工验收。</p></details></div>
<div class="compare-tools"><div><span class="group-title">左侧参考</span><select id="leftArtifact" aria-label="左侧产物"></select><select id="leftPosition" aria-label="左侧位置"></select><select id="leftZoom" aria-label="左侧缩放"><option value="100">适合栏宽</option><option value="125">125%</option><option value="175">175%</option><option value="250">250%</option></select></div><div><span class="group-title">右侧产物</span><select id="rightArtifact" aria-label="右侧产物"></select><select id="rightPosition" aria-label="右侧位置"></select><select id="rightZoom" aria-label="右侧缩放"><option value="100">适合栏宽</option><option value="125">125%</option><option value="175">175%</option><option value="250">250%</option></select></div></div>
<div class="filters"><label>Markdown <select id="markdownMode"><option value="reading">格式化阅读</option><option value="source">源码查看</option></select></label><span class="muted">独立翻页和滚动 · 原件页与输出页不自动对应</span><label>产物错误 <select id="errorFilter"><option value="">全部</option><option value="yes">有处理错误</option><option value="remote">远端错误</option><option value="local">本地错误</option><option value="no">无处理错误</option></select></label><label>产物评论 <select id="commentFilter"><option value="">全部</option><option value="yes">有评论</option><option value="no">无评论</option></select></label></div></header>
<main><section id="leftPane" class="pane"><div id="leftNotice" class="notice"></div><div id="leftContent" class="content"></div></section><section id="rightPane" class="pane"><div id="rightNotice" class="notice"></div><div id="rightContent" class="content"></div></section></main>
<footer><details id="commentPanel" open><summary>评论与反馈 <span id="commentTargetLabel"></span></summary><div class="comment-heading"><select id="commentScope" aria-label="评论对象"><option value="artifact">评论当前产物</option><option value="source_page">评论原图</option></select><span class="muted">评论独立保存，不改变正文或代表验收。</span></div><textarea id="comment" placeholder="填写当前对象的评论…"></textarea><div class="feedback-actions"><button id="saveServer" class="primary">保存评论</button><button id="clearComment">清除</button><button id="resolveImport" hidden>采用导入记录（先备份）</button><button id="export">导出 JSON</button><label class="file-label">导入 JSON<input id="import" type="file" accept=".json"></label><select id="reviewer"><option value="human">本人（自行声明）</option><option value="developer-agent">开发 Agent 测试</option></select><span id="status" role="status"></span></div></details><details class="technical"><summary>技术详情</summary><pre id="technical"></pre></details></footer>
<script src="project.js"></script><script src="feedback.js"></script><script src="viewer.js"></script></html>
