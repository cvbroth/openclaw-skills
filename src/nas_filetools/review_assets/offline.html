<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>离线 OCR 复核（实验）</title>
<style>body{font-family:system-ui,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;margin:20px;background:#f4f5f7;color:#161616}header{position:sticky;top:0;background:white;padding:12px;z-index:2;border:1px solid #bbb}button,input,select,textarea{font:inherit;margin:4px;padding:5px}article{background:white;padding:14px;margin:16px 0;border:1px solid #bbb}img{max-width:100%;max-height:250px;object-fit:contain;object-position:left}pre{font-family:inherit;white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:95%;min-height:65px}.hint{color:#713900}details{margin:8px 0}label{display:inline-block}a{color:#1254a3}.badge{background:#eee;padding:4px}#summary{max-height:150px;overflow:auto}</style>
<header><strong>离线 OCR 复核包 · 开发实验</strong><div class="hint">初始未确认。分数不是正确概率；单项确认不是整页通过。原图无法辨认时保留未知，不猜补。导出JSON后由开发侧校验导入；本页不会上传数据。</div>
<label>页<select id="page"><option value="">全部</option></select></label><label>风险<select id="risk"><option value="">全部</option></select></label><label>状态<select id="status"><option value="">全部</option></select></label>
<label>审阅者类型<select id="reviewer"><option value="human">用户/人类（自行声明）</option><option value="developer-agent">开发Agent</option></select></label><label>审阅者名称<input id="name" placeholder="填写真实审阅者"></label><button id="export">导出确认JSON</button><button id="save">下载草稿JSON</button><label>恢复草稿<input type="file" id="draft" accept="application/json"></label><button id="prev">上一组</button><button id="next">下一组（每组25项）</button><div id="count"></div><details><summary>逐页筛查（未报警不代表已核实）</summary><pre id="summary"></pre></details></header>
<main id="items"></main><script id="data" type="application/json">/*__REVIEW_DATA__*/</script>
<script>
'use strict';
const payload=JSON.parse(document.getElementById('data').textContent), data=payload.snapshot, hashes=payload.hashes;
const $=id=>document.getElementById(id), changes=new Map();let offset=0;const pageSize=25;
function el(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n;}
function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function options(node,values){for(const value of [...new Set(values)].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}))){const o=el('option',value,node);o.value=value;}}
options($('page'),data.pages.map(p=>p.physical_page));options($('risk'),data.items.flatMap(i=>i.risks));options($('status'),['unconfirmed','confirmed','uncertain','source_unreadable','nonbody','text_confirmed_layout_pending','draft']);
$('summary').textContent=JSON.stringify(data.pages.map(p=>({physical_page:p.physical_page,printed_page:p.printed_page,screening:p.screening,whole_page_status:p.review_status})),null,2);
function draw(){const main=$('items');main.replaceChildren();const shown=data.items.filter(i=>(!$('page').value||String(i.physical_page)===$('page').value)&&(!$('risk').value||i.risks.includes($('risk').value))&&(!$('status').value||($('status').value==='draft'?changes.has(i.id):i.status===$('status').value)));
$('count').textContent=`修订 ${data.revision} · ${shown.length}/${data.items.length} 项 · 草稿 ${changes.size} 项（未导入） · 显示 ${offset+1}–${Math.min(offset+pageSize,shown.length)}`;
for(const i of shown.slice(offset,offset+pageSize)){const p=data.pages.find(p=>p.physical_page===i.physical_page), a=el('article',undefined,main);a.id=i.id;el('h3',`${i.id} · 物理${i.physical_page} / 印刷${i.printed_page??'未知'} · ${i.status}`,a);el('p',i.risks.join(' / ')+(i.blocking?' · 阻塞复核':''),a);const link=el('a','打开整页原图',a);link.href=p.image_asset;link.target='_blank';link.rel='noopener';const im=el('img',undefined,a);im.src=i.crop_asset;im.loading='lazy';im.alt='原图区域，点击放大';im.style.cursor='zoom-in';im.onclick=()=>window.open(i.crop_asset,'_blank','noopener');el('p',`原图裁片坐标 ${JSON.stringify(i.source_bbox)} · 当前定位 ${JSON.stringify(i.bbox)} · 目标 ${i.target??'尚未可靠定位'}`,a);el('strong','原始识别/解析文字',a);el('pre',i.original_text,a);el('strong','当前整理文字（编辑/非正文作用于整个目标块；待定位片段另存）',a);const text=el('textarea',undefined,a);text.value=i.current_text;
const detail=el('details',undefined,a);el('summary','原因、来源、恢复依据及上下文',detail);el('pre',JSON.stringify({sources:i.sources,context:i.context,related_targets:i.related_targets,variant_text:i.variant_text},null,2),detail);
const action=el('select',undefined,a);for(const [v,t] of [['confirm_text','确认文字（不等于位置确认）'],['edit_text','修改文字'],['place','调整位置/顺序或定位片段'],['uncertain','保留无法确定'],['source_unreadable','原图无法辨认/需更清晰来源'],['nonbody','标记非正文（保留审计）']]){const o=el('option',t,action);o.value=v;}
if(i.risks.includes('source_damage')){for(const o of [...action.options])if(!['uncertain','source_unreadable'].includes(o.value))o.remove();}
const box=el('input',undefined,a);box.value=JSON.stringify(i.bbox);box.title='位置操作：原图坐标 [x0,y0,x1,y1]';const before=el('select',undefined,a);el('option','位置操作：放在此块之前',before).value='';for(const b of p.blocks){const o=el('option',b.id+' '+b.block_content.slice(0,35),before);o.value=b.id;}
const reason=el('input',undefined,a);reason.placeholder='必须填写依据/理由';const old=changes.get(i.id);if(old){action.value=old.action;text.value=old.text??text.value;box.value=JSON.stringify(old.bbox??i.bbox);before.value=old.before_target??'';reason.value=old.reason;}
const save=el('button','加入导出草稿',a);save.onclick=()=>{try{if(!reason.value.trim())throw Error('请填写理由');const op={id:i.id,action:action.value,expected_hash:hashes.items[i.id],reason:reason.value};if(op.action==='edit_text')op.text=text.value;if(op.action==='place'){op.bbox=JSON.parse(box.value);op.before_target=before.value;if(!op.before_target)throw Error('请选择真实目标块');}changes.set(i.id,op);$('count').textContent=`草稿 ${changes.size} 项（尚未导入）`;save.textContent='已加入草稿';}catch(e){alert(e.message);}};
const remove=el('button','移除草稿',a);remove.onclick=()=>{changes.delete(i.id);draw();};}
if($('page').value){const p=data.pages.find(p=>String(p.physical_page)===$('page').value),a=el('article',undefined,main);el('p','整页确认仅限真实人类逐页检查，且所有结构阻塞已解决。导入器会再次校验。',a);const reason=el('input',undefined,a);reason.placeholder='整页确认范围及依据';const b=el('button','加入整页确认',a);b.onclick=()=>{if(!reason.value.trim())return alert('请填写依据');changes.set(String(p.physical_page),{id:String(p.physical_page),action:'confirm_page',expected_hash:hashes.pages[p.physical_page],reason:reason.value});alert('已加入整页确认；开发侧导入仍需满足阻塞检查');};}}
for(const id of ['page','risk','status'])$(id).onchange=()=>{offset=0;draw();};
$('prev').onclick=()=>{offset=Math.max(0,offset-pageSize);draw();};
$('next').onclick=()=>{const count=data.items.filter(i=>(!$('page').value||String(i.physical_page)===$('page').value)&&(!$('risk').value||i.risks.includes($('risk').value))&&(!$('status').value||($('status').value==='draft'?changes.has(i.id):i.status===$('status').value))).length;if(offset+pageSize<count)offset+=pageSize;draw();};
function receipt(){if(!$('name').value.trim())throw Error('请填写审阅者名称');return{schema:'offline-ocr-confirmation-v1',receipt_id:'offline-'+Date.now()+'-'+Math.random().toString(16).slice(2),base_revision_hash:data.revision_hash,reviewer_type:$('reviewer').value,reviewer_name:$('name').value.trim(),operations:[...changes.values()]};}
$('export').onclick=()=>{try{if(!changes.size)throw Error('没有确认操作');download(receipt(),'ocr-confirmations.json');}catch(e){alert(e.message);}};
$('save').onclick=()=>download({base_revision_hash:data.revision_hash,operations:[...changes.values()]},'ocr-review-draft.json');
if(data.pages.some(p=>p.physical_page===127))$('page').value='127';
$('draft').onchange=async()=>{try{const x=JSON.parse(await $('draft').files[0].text());if(x.base_revision_hash!==data.revision_hash)throw Error('草稿版本过期');const known=new Set([...data.items.map(i=>i.id),...data.pages.map(p=>String(p.physical_page))]);if(!Array.isArray(x.operations)||x.operations.some(o=>!known.has(o.id)))throw Error('未知ID');for(const o of x.operations)changes.set(o.id,o);draw();}catch(e){alert(e.message);}};draw();
</script></html>
