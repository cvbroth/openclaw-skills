<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板库 · FileTools</title><link rel="stylesheet" href="/assets/app.css"><header class="top"><a class="brand" href="/">FileTools</a><span>模板库 · 独立开发环境</span></header><main><h1>排版模板</h1><p>复制、编辑并另存版本。固定合成内容实际生成 Word/PDF 预览后才可发布；发布不代表人工验收。</p><section class="card"><label>已有模板<select id="library"></select></label><button id="load">载入 / 复制</button><label>导入配置 JSON<input id="import" type="file" accept=".json"></label></section><section class="card"><h2>模板配置</h2><div id="fields" class="form-row"></div><h3>排版参数</h3><div id="parameters" class="form-row"></div><details><summary>完整声明式配置（可编辑）</summary><textarea id="config" rows="20" style="width:100%"></textarea></details><div class="form-row"><button id="save" class="primary">另存草稿版本</button><button id="export">导出 JSON</button><button id="preview">生成固定内容预览</button><button id="publish">发布当前版本</button><a id="previewLink" hidden>查看实际预览与产物</a></div><p>不支持脚本、宏、任意 Word/PDF 自动提取模板。字体必须在服务端安装；缺字时生成失败，不静默替换。</p></section><p id="message" role="status"></p></main><script src="/assets/templates.js"></script></html>
