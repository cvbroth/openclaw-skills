<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板库 · FileTools</title><link rel="stylesheet" href="/assets/app.css"><header class="top"><a class="brand" href="/">FileTools</a><span>模板库 · 独立开发环境</span></header><main class="template-page"><h1>排版模板</h1><p>复制、编辑并另存版本。固定合成内容实际生成 Word/PDF 预览后才可发布；发布不代表人工验收。</p><section class="card"><label>已有模板<select id="library"></select></label><button id="load">载入</button><button id="copy">复制为新版本</button><label>导入配置 JSON<input id="import" type="file" accept=".json"></label><label>导入Word样式（最多20MiB）<input id="wordImport" type="file" accept=".docx,.dotx"></label></section><section id="wordReport" class="card" hidden><h2>Word样式提取报告</h2><pre id="wordReportText"></pre><div class="template-grid"><label>适用节<select id="wordSection"></select></label><label>统一字体<select id="wordFont"></select></label></div><button id="applyWord">应用选择到编辑器</button></section><section class="card"><h2>模板配置 <small id="templateState"></small></h2><div id="fields" class="template-grid"></div><h3>排版参数</h3><div id="parameters" class="template-parameters"></div><details><summary>完整声明式配置（可编辑）</summary><textarea id="config" rows="20" style="width:100%"></textarea></details><div class="form-row"><button id="save" class="primary">另存草稿版本</button><button id="export">导出 JSON</button><button id="preview">生成固定内容预览</button><button id="publish">发布当前版本</button><a id="previewLink" hidden>查看实际预览与产物</a></div><p>只提取明确支持的无宏Word样式，不完整还原任意Word；PDF仅作参考，不自动提取模板。字体必须在服务端安装；缺字时生成失败，不静默替换。</p></section><p id="message" role="status"></p></main><script src="/assets/templates.js"></script></html>
