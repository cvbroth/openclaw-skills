<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileTools · 文件项目</title><link rel="stylesheet" href="/assets/app.css">
<header class="top"><a class="brand" href="/">FileTools<span>文件转换与对照</span></a><a href="/templates">模板库</a><span class="tag">独立开发环境</span></header>
<main>
<section id="listView"><div class="page-heading"><div><p class="eyebrow">文档工作台</p><h1>文件项目</h1><p class="muted">上传原件，保留转换版本，逐页查看与评论。</p></div><button id="toggleUpload" class="primary">＋ 上传文件</button></div>
<section id="upload" class="card" hidden><h2>新建转换项目</h2><label class="file-field">原件<input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp"></label><div class="form-row"><label>识别引擎<select id="engine"></select></label><label>选取物理页<input id="pages" value="1" placeholder="例如 1,2"></label><button id="start" class="primary">上传并转换</button></div><p class="muted">默认只处理首张。M3会发起实际远端调用，本轮查看已有结果无需重新转换。</p><progress id="uploadProgress" max="100" value="0"></progress></section>
<div class="list-controls"><input id="search" type="search" placeholder="查找文件项目" aria-label="查找项目"><select id="kindFilter" aria-label="项目类别"><option value="">全部项目</option><option value="user">用户项目</option><option value="historical-validation">历史验证项目</option><option value="template-preview">模板合成预览</option></select><button id="showTrash" class="quiet">回收站</button></div><div id="recycle" class="card" hidden></div><div id="projects" class="project-list"></div></section>
<section id="detail" hidden><a class="back" href="/">← 返回项目列表</a><div class="page-heading"><div><p class="eyebrow">项目详情</p><h1 id="name"></h1><p id="summary" class="muted"></p></div><a id="review" class="button primary">打开对照评审 →</a></div>
<div class="detail-grid"><section class="card"><h2>转换任务</h2><div id="tasks"></div><details class="new-task"><summary>使用另一引擎生成新版本</summary><div class="form-row"><select id="newEngine" aria-label="新任务引擎"></select><input id="newPages" value="1" size="8" aria-label="新任务页码"><button id="newTask">新建转换任务</button></div><p class="muted">保留旧结果；不会自动切换或重新识别。</p></details></section><section class="card"><div class="section-heading"><h2>内容与产物</h2><a id="export" class="button">下载离线项目包</a></div><div class="form-row"><label>已有文字稿<select id="formatSource"></select></label><label>排版模板<select id="formatTemplate"></select></label><button id="formatExisting">仅重新排版</button></div><p class="muted">不重新识别；追加 Word/PDF 与模板快照。</p><div id="artifacts"></div></section></div>
<details class="card"><summary>项目设置</summary><div class="form-row"><label>项目名称<input id="rename"></label><button id="renameButton">保存名称</button><button id="trash" class="danger">移入回收站</button></div></details><details class="card"><summary>技术详情与诊断</summary><pre id="technical"></pre></details></section>
<p id="message" role="status" class="message"></p></main><script src="/assets/app.js"></script></html>
