<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FileTools 文件项目</title><link rel="stylesheet" href="/assets/app.css">
<header><strong>FileTools 文件项目</strong><span>独立开发服务 · 非生产部署</span></header><main><section id="upload"><h2>上传并转换</h2><input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp"><label>引擎 <select id="engine"></select></label><label>物理页码（逗号分隔，默认首张）<input id="pages" value="1" size="10"></label><button id="start">上传并排队</button><progress id="uploadProgress" max="100" value="0"></progress><p id="message" role="status"></p></section><h2>项目</h2><button id="showTrash">查看回收站</button><div id="recycle" hidden></div><div id="projects"></div><section id="detail" hidden><h2 id="name"></h2><div class="actions"><input id="rename" aria-label="项目新名称"><button id="renameButton">改名</button><a id="review" target="_blank">对照评审</a><a id="export">下载项目包</a><button id="trash">移入回收站</button></div><div id="tasks"></div><label>追加新引擎版本 <select id="newEngine"></select></label><input id="newPages" value="1" size="10" aria-label="新任务页码"><button id="newTask">新建转换任务</button><h3>产物</h3><div id="artifacts"></div><details><summary>技术详情（ID、哈希、运行参数）</summary><pre id="technical"></pre></details></section></main><script src="/assets/app.js"></script></html>
